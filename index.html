body{font-family:Montserrat,sans-serif;background:#0a0a0a;color:white;overflow-x:hidden}

/* BOKEH EFFECT KAYA DI VIDEO */
.bokeh{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
.bokeh span{position:absolute;background:white;border-radius:50%;opacity:0.15;animation: float 8s infinite ease-in-out}
.bokeh span:nth-child(1){width:12px;height:12px;left:10%;top:20%;animation-delay:0s}
.bokeh span:nth-child(2){width:20px;height:20px;left:70%;top:30%;animation-delay:1s}
.bokeh span:nth-child(3){width:8px;height:8px;left:40%;top:60%;animation-delay:2s}
.bokeh span:nth-child(4){width:15px;height:15px;left:80%;top:70%;animation-delay:3s}
.bokeh span:nth-child(5){width:10px;height:10px;left:20%;top:80%;animation-delay:4s}
@keyframes float{0%,100%{transform:translateY(0) translateX(0) scale(1)}50%{transform:translateY(-80px) translateX(20px) scale(1.2)}}

.arch-frame{border-radius: 200px 200px 0 0; overflow:hidden; border:1.5px solid rgba(255,255,255,.3); box-shadow:0 20px 60px rgba(0,0,0,.4)}

<body>
<div class="max-w-[420px] mx-auto bg-black min-h-screen relative">

<!-- TOOLS HEADER (HANYA DI TOOLS, TIDAK DI UNDANGAN) -->

<p class="text-[11px] opacity-70">Kevin & Monica Style - Arch + Bokeh + AOS</p>
</div>

<div class="bg-white rounded-xl p-4 mt-3 border">
<p class="font-bold text-[12px]">1. Upload Excel Prompt (100 undangan)</p>
<input type="file" id="excelFile" accept=".xlsx" class="mt-2 text-[11px]">
<button onclick="downloadTemplate()" class="mt-2 bg-[#0F172A] text-white px-4 py-2 rounded-full text-[11px]">Download Template 100 Prompt</button>
<div id="preview" class="mt-2 text-[11px] bg-[#FFFBF7] p-3 rounded-xl hidden"></div>
</div>

<div class="bg-white rounded-xl p-4 mt-3 border">

<div id="progress" class="mt-3 hidden"><div class="w-full bg-gray-100 rounded-full h-2"><div id="progFill" class="bg-[#0F172A] h-2 rounded-full" style="width:0%"></div></div><div id="progText" class="text-[10px] mt-1">0%</div></div>
<div id="result" class="mt-3 space-y-2"></div>
<button id="btnExcel" onclick="downloadExcel()" class="hidden w-full bg-[#D4AF37] text-white py-3 rounded-full font-bold text-[12px] mt-3">Download Excel Hasil + 100 Link</button>
</div>
</div>

<!-- PREVIEW AREA UNDANGAN ANIMASI (INI HASILNYA) -->
<div id="previewInvitation" class="hidden"></div>

</div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
let rows = []; let generated = [];

function downloadTemplate(){
  let all = [["prompt","groom","bride","tanggal","maps","ayah_groom","ibu_groom","ayah_bride","ibu_bride","warna","lagu"]];
  const samples = [
    ["black tuxedo black dress sunglasses luxury elegant modern arch","Kevin","Monica","2025-12-21","Grand Ballroom Sheraton Surabaya","Bpk. Hendry","Ibu Susi","Bpk. Wijaya","Ibu Dewi","#D4AF37","https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"],
    ["elegant black gold luxury glamour arch bokeh","Ryo","Amanda","2025-12-25","Hotel Majapahit Surabaya","Bpk. Hartono","Ibu Siti","Bpk. Wijaya","Ibu Dewi","#D4AF37",""],
    ["navy blue gold royal arch luxury","Dimas","Putri","2025-01-15","The Ritz Carlton Jakarta","Bpk. Saputra","Ibu Lestari","Bpk. Hartono","Ibu Siti","#0F2A4A",""]
  ];
  for(let i=0;i<100;i++){
    const s = samples[i % samples.length];
    all.push([s[0], s[1]+(i>=3?i:''), s[2]+(i>=3?i:''), s[3], s[4], s[5], s[6], s[7], s[8], s[9], s[10]]);
  }
  const ws = XLSX.utils.aoa_to_sheet(all);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Prompt_100_Animasi");
  XLSX.writeFile(wb, "SAYIDO_100_Prompt_Animasi_Moran.xlsx");
}

document.getElementById('excelFile').addEventListener('change', e=>{
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = evt=>{
    const wb = XLSX.read(evt.target.result, {type:'binary'});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    rows = XLSX.utils.sheet_to_json(sheet);
    rows = rows.map(r=>{ const o={}; Object.keys(r).forEach(k=>o[k.toLowerCase()]=r[k]); return o; });
    const p = document.getElementById('preview');
    p.classList.remove('hidden');
    p.innerHTML = `✅ ${rows.length} prompt loaded<br>`+rows.slice(0,3).map((r,i)=>`${i+1}. ${r.groom} & ${r.bride} - ${r.prompt.substring(0,40)}...`).join('<br>');
  };
  reader.readAsBinaryString(file);
});

function bulkGenerate(){
  if(!rows.length){ alert('Upload Excel dulu!'); return; }
  document.getElementById('progress').classList.remove('hidden');
  const res = document.getElementById('result');
  res.innerHTML=''; generated=[];
  
  rows.forEach((r,i)=>{
    const pct = Math.round((i+1)/rows.length*100);
    document.getElementById('progFill').style.width=pct+'%';
    document.getElementById('progText').innerText=`${i+1}/${rows.length} - ${pct}%`;
    
    const html = generateMoranAnimationHTML(r);
    const slug = `${r.groom}-${r.bride}-${Date.now()+i}`.toLowerCase().replace(/[^a-z0-9-]/g,'-');
    generated.push({slug, html, row:r});
    
    const div = document.createElement('div');
    div.className='bg-[#FFFBF7] border rounded-xl p-3 flex justify-between items-center';
    div.innerHTML=`<div><div class="font-bold text-[12px] text-black">${r.groom} & ${r.bride}</div><div class="text-[10px] text-gray-500">${r.prompt.substring(0,45)}...</div><div class="text-[10px] text-blue-600">/u/${slug}.html</div></div><div class="flex gap-1"><button onclick="previewIdx(${i})" class="bg-white border px-2 py-1 rounded-full text-[10px] text-black">Preview</button><button onclick="downloadIdx(${i})" class="bg-black text-white px-2 py-1 rounded-full text-[10px]">HTML</button></div>`;
    res.appendChild(div);
  });
  document.getElementById('btnExcel').classList.remove('hidden');
}

function generateMoranAnimationHTML(r){
  const groom = r.groom||'Kevin';
  const bride = r.bride||'Monica';

  const maps = r.maps||'Sheraton Surabaya';

  const ayahG = r.ayah_groom||'Bpk. Hendry';
  const ibuG = r.ibu_groom||'Ibu Susi';
  const ayahB = r.ayah_bride||'Bpk. Wijaya';
  const ibuB = r.ibu_bride||'Ibu Dewi';
  
  return `<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>The Wedding of ${groom} & ${bride}</title><script src="https://cdn.tailwindcss.com"><\/script><link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"><style>@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400&family=Cormorant+Garamond:wght@300&display=swap');body{font-family:Montserrat;background:#0a0a0a;color:white}.script{font-family:'Great Vibes',cursive}.serif{font-family:'Cormorant Garamond',serif}.bokeh{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}.bokeh span{position:absolute;background:white;border-radius:50%;opacity:.15;animation:float 8s infinite ease-in-out}.bokeh span:nth-child(1){width:12px;height:12px;left:10%;top:20%}.bokeh span:nth-child(2){width:20px;height:20px;left:70%;top:30%;animation-delay:1s}.bokeh span:nth-child(3){width:8px;height:8px;left:40%;top:60%;animation-delay:2s}.arch-frame{border-radius:200px 200px 0 0;overflow:hidden;border:1.5px solid rgba(255,255,255,.3)}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-80px) translateX(20px)}}</style></head><body class="max-w-[420px] mx-auto bg-[#0a0a0a] overflow-x-hidden">
<!-- COVER ANIMASI KAYA VIDEO -->
<div class="relative h-screen flex flex-col justify-end p-6 text-center overflow-hidden" style="background:linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.6)), url('https://images.unsplash.com/photo-1519741497674-611481863552?w=800') center/cover">
<div class="bokeh"><span></span><span></span><span></span><span></span><span></span></div>
<div class="relative z-10" data-aos="fade-up" data-aos-duration="1500">
<p class="text-[10px] tracking-[5px] opacity-70" data-aos="fade-up" data-aos-delay="200">THE WEDDING OF</p>
<h1 class="script text-[38px] mt-2" style="color:${warna}" data-aos="fade-up" data-aos-delay="400">${groom} & ${bride}</h1>
<div class="mt-6 border-t border-b border-white/20 py-4" data-aos="fade-up" data-aos-delay="600">
<p class="text-[11px] tracking-wide">Kepada Bapak/Ibu/Saudara/i</p>
<p id="toName" class="font-bold text-[14px] mt-1">Yogi dan Ratna</p>
<p class="text-[11px] opacity-70 mt-1">Di Tempat</p>
</div>
<button onclick="document.getElementById('main').scrollIntoView({behavior:'smooth'})" class="mt-6 border border-white/30 px-8 py-3 rounded-full text-[11px] tracking-[2px] flex items-center justify-center mx-auto gap-2" data-aos="fade-up" data-aos-delay="800"><i class="fa-solid fa-envelope-open"></i> Buka Undangan</button>
</div>
</div>

<div id="main">
<!-- QUOTE + COUNTDOWN -->

<div class="opacity-30">:</div>
<div class="text-center"><div id="cdH" class="text-[28px] font-light">00</div><div class="text-[9px] tracking-[2px] opacity-50">Hrs</div></div>
<div class="opacity-30">:</div>
<div class="text-center"><div id="cdM" class="text-[28px] font-light">00</div><div class="text-[9px] tracking-[2px] opacity-50">Min</div></div>
<div class="opacity-30">:</div>
<div class="text-center"><div id="cdS" class="text-[28px] font-light">00</div><div class="text-[9px] tracking-[2px] opacity-50">Sec</div></div>
</div>
</div>

<!-- THE COUPLE - ARCH KAYA DI VIDEO -->
<div class="bg-[#111] py-16 px-6">
<p class="text-center serif text-[28px]" data-aos="fade-up">The Couple</p>
<p class="text-center text-[10px] tracking-[3px] opacity-50 mt-2" data-aos="fade-up" data-aos-delay="200">Tanpa mengurangi rasa hormat, perkenankan kami mengundang Bapak/Ibu/Saudara untuk menghadiri acara pernikahan kami :</p>

<div class="mt-10" data-aos="fade-up" data-aos-delay="300">

<img src="https://i.pravatar.cc/400?img=8" class="w-full h-[400px] object-cover">
</div>
<div class="text-center mt-6">
<h3 class="script text-[26px]" style="color:${warna}">${groom}</h3>
<p class="text-[11px] opacity-70">${groom} Saputra</p>
<p class="text-[10px] opacity-50 mt-1">Putra dari ${ayahG} & ${ibuG}</p>
</div>
</div>

<div class="mt-12" data-aos="fade-up" data-aos-delay="400">

<img src="https://i.pravatar.cc/400?img=5" class="w-full h-[400px] object-cover">
</div>

</div>

<!-- OUR LOVE STORY -->
<div class="bg-[#0a0a0a] py-16 px-8 text-center relative">
<p class="text-[11px] tracking-[4px] opacity-50" data-aos="fade-up">OUR LOVE STORY</p>
<div class="mt-8 space-y-8 text-left">
<div data-aos="fade-up"><p class="text-[11px] opacity-50">Tahun 2008</p><p class="text-[11px] mt-2 leading-relaxed opacity-80">Di dunia yang luas ini, kami berdua tidak ada pertemuan yang benar-benar kebetulan. Tuhan mempertemukan dua hati pada waktu yang tepat dengan cara yang sederhana tapi bermakna.</p></div>

<div data-aos="fade-up"><p class="text-[11px] opacity-50">Tahun 2025</p><p class="text-[11px] mt-2 leading-relaxed opacity-80">Atas kehendak-Nya, kami melangkah ke tahap yang lebih serius dengan melangsungkan lamaran pada bulan special kami yaitu bulan kelahiran kami berdua yaitu pada Mei 2025.</p></div>
</div>
</div>

<!-- WEDDING GALLERY -->
<div class="bg-black py-16">
<p class="serif text-[32px] text-center" data-aos="fade-up">Wedding Gallery</p>
<div class="grid grid-cols-3 gap-2 mt-8 px-3" data-aos="fade-up" data-aos-delay="200">
<img src="https://images.unsplash.com/photo-1519741497674-611481863552?w=400" class="h-[120px] w-full object-cover">

<!-- WEDDING GIFT -->
<div class="bg-[#111] py-16 px-6 text-center">
<p class="serif text-[28px]" data-aos="fade-up">Wedding Gift</p>
<p class="text-[11px] opacity-60 mt-2 leading-relaxed" data-aos="fade-up" data-aos-delay="200">Kehadiran dan doa restu Bapak/Ibu/Saudara/i merupakan anugerah terindah bagi kami. Namun jika Bapak/Ibu/Saudara/i hendak memberikan tanda kasih, dapat menggunakan fitur di bawah ini</p>

<div class="bg-white/5 border border-white/10 rounded-xl p-4 flex justify-between items-center"><div class="text-left"><p class="text-[10px] opacity-50">BANK BCA</p><p class="font-bold text-[13px]">A/n ${bride} Saputra</p></div><button onclick="copyText('1234567890')" class="bg-[#D4AF37] text-black px-4 py-2 rounded-full text-[10px]"><i class="fa-solid fa-copy mr-1"></i>Copy</button></div>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"><\/script>
<script>
AOS.init({duration:1200, once:true});
const params=new URLSearchParams(location.search); const to=params.get('to'); if(to){ document.getElementById('toName').innerText=to.replace(/-/g,' '); }
function cd(){ const target=new Date('${tanggal}').getTime()||new Date('2025-12-21').getTime(); let diff=target-Date.now(); if(diff<0) diff=0; const d=Math.floor(diff/86400000),h=Math.floor(diff%86400000/3600000),m=Math.floor(diff%3600000/60000),s=Math.floor(diff%60000/1000); document.getElementById('cdD').innerText=String(d).padStart(2,'0'); document.getElementById('cdH').innerText=String(h).padStart(2,'0'); document.getElementById('cdM').innerText=String(m).padStart(2,'0'); document.getElementById('cdS').innerText=String(s).padStart(2,'0'); } setInterval(cd,1000); cd();
function copyText(t){ navigator.clipboard.writeText(t); alert('Disalin: '+t); }
let playing=false; function toggleMusic(){ const a=document.getElementById('music'); if(!playing){ a.play(); playing=true; } else{ a.pause(); playing=false; } }
<\/script>
</body></html>`;
}

function previewIdx(i){ const item=generated[i]; const w=window.open(); w.document.write(item.html); w.document.close(); }
function downloadIdx(i){ const item=generated[i]; const blob=new Blob([item.html],{type:'text/html'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=item.slug+'.html'; a.click(); URL.revokeObjectURL(url); }
function downloadExcel(){
  const data = generated.map(g=>({groom:g.row.groom, bride:g.row.bride, prompt:g.row.prompt, tanggal:g.row.tanggal, maps:g.row.maps, warna:g.row.warna, slug:g.slug, link:`https://sayido-animasi-moran.vercel.app/u/${g.slug}.html`, link_personal:`https://sayido-animasi-moran.vercel.app/u/${g.slug}.html?to=NamaTamu`}));
  const ws=XLSX.utils.json_to_sheet(data);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Hasil');
  XLSX.writeFile(wb,'HASIL_100_Link_Animasi_Moran.xlsx');
}
</script>
