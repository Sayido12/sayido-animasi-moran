<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SAYIDO BULK v2.1 FULL MORAN</title><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet"><link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Manrope',sans-serif;background:#FAF8F5;color:#1A1A1A;padding:16px}.header{background:#111;color:#fff;padding:24px;border-radius:20px;text-align:center;margin-bottom:20px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 20px rgba(0,0,0,.06);margin-bottom:16px;border:1px solid #eee}.btn{background:#111;color:#fff;border:none;padding:12px 18px;border-radius:12px;font-weight:600;cursor:pointer}.btn-gold{background:#D4AF37;color:#111}.grid{display:grid;gap:12px}.inv-card{border:1px solid #E8D0D8;border-radius:16px;padding:14px;background:#FFFEFB}.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:10px;background:#F5EFE6;margin:2px}.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.actions button{padding:8px 10px;border-radius:10px;border:1px solid #ddd;background:#fff;font-size:12px;cursor:pointer}.actions button.primary{background:#111;color:#fff}.mockup-preview{width:260px;height:540px;border:12px solid #111;border-radius:36px;overflow:hidden;margin:10px auto;background:#000}.mockup-preview iframe{width:100%;height:100%;border:none}input,textarea,select{width:100%;padding:10px;border-radius:10px;border:1px solid #ddd;margin-top:6px;font-size:14px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:99;padding:20px}.modal.active{display:flex}.modal-box{background:#fff;border-radius:20px;padding:20px;max-width:480px;width:100%;max-height:90vh;overflow:auto}</style></head><body><div class="header"><h1>SAYIDO BULK v2.1 FULL</h1><p>100 Tema Beda WARNA - Full Moran Template - Mockup HP - Video - Editor</p><p style="font-size:11px;opacity:.6;margin-top:6px">FIX: template sekarang FULL kayak Moran asli, bukan kosong!</p></div><div class="card"><h3>🔐 Admin</h3><input type="password" id="adminPass" placeholder="sayido123"><button class="btn" onclick="checkAdmin()">Aktifkan</button><span id="adminStatus"></span></div><div class="card"><button class="btn btn-gold" onclick="download100Beda()">📥 Download 100 Tema Beda Excel</button></div><div class="card"><input type="file" id="excelFile" accept=".xlsx,.xls"><div id="uploadInfo"></div><button class="btn" style="width:100%;padding:16px;margin-top:10px" onclick="generateBulk()">🎬 GENERATE 100 FULL TEMPLATE</button><div style="background:#eee;height:10px;border-radius:10px;margin-top:10px"><div id="prog" style="height:100%;width:0%;background:#111"></div></div><div id="progText">0/100</div></div><div class="card"><h3>Hasil</h3><div id="results" class="grid"></div></div><div id="editModal" class="modal"><div class="modal-box"><h3>Edit</h3><div id="editForm"></div><button class="btn" onclick="saveEdit()">Simpan</button><button class="btn" onclick="closeModal()">Tutup</button></div></div><div id="mockupModal" class="modal"><div class="modal-box" style="text-align:center"><h3>Mockup</h3><div id="mockupContainer"></div><button class="btn" onclick="downloadMockupPNG()">Download PNG</button><button class="btn" onclick="closeMockup()">Tutup</button></div></div><script>
const THEMES_100=[["Moran Luxury black tuxedo gold","#D4AF37","Moran Luxury","Sheraton Surabaya"],["Glamour Night black gold bokeh","#111111","Glamour Night","Grand Ballroom"],["Royal Navy blue gold royal","#0F2A4A","Royal Navy","The Ritz Carlton"],["Rustic Boho sage terracotta dried","#8B7355","Rustic Boho","Garden Villa"],["Japandi Minimal white beige clean","#E8D5C4","Japandi Minimal","Rooftop Garden"],["Floral Romantic pink watercolor","#FFB6C1","Floral Romantic","Garden Villa"],["Moody Burgundy black luxury","#800020","Moody Burgundy","Grand Ballroom"],["Beach Tropical palm sand beige ocean","#D2B48C","Beach Tropical","Beach Resort"],["Jawa Traditional kebaya batik pendopo","#8B4513","Jawa Traditional","Pendopo Agung"],["Sunda Pastel peach garden","#FFCBA4","Sunda Pastel","Garden Villa"],["Chinese Oriental red gold","#C41E3A","Chinese Oriental","Grand Ballroom"],["Korean Minimal white cherry blossom","#FFF0F5","Korean Minimal","Garden Villa"],["Industrial Loft grey concrete","#808080","Industrial Loft","Urban Loft"],["Vintage Cream lace classic","#F5F5DC","Vintage Cream","Classic Garden"],["Sunset Boho orange dusty pink desert","#FF7F50","Sunset Boho","Desert Villa"],["Emerald Luxury green gold ballroom","#2D5A27","Emerald Luxury","Grand Ballroom"],["Lilac Dream purple lavender","#C8A2C8","Lilac Dream","Garden Villa"],["Champagne Glam gold glitter night","#C9A86A","Champagne Glam","Ballroom"],["Forest Woodland green moss","#228B22","Forest Woodland","Forest Venue"],["Sky Airy blue cloud daytime","#87CEEB","Sky Airy","Rooftop"],["Maroon Royal velvet gold palace","#800000","Maroon Royal","Palace Ballroom"],["Peach Fuzz coral modern","#FFBE98","Peach Fuzz 2024","Modern Venue"],["Charcoal Modern grey silver","#36454F","Charcoal Modern","Urban Loft"],["Ivory Pearl timeless elegant","#FFFFF0","Ivory Pearl","Classic Ballroom"],["Terracotta Med clay Mediterranean","#E2725B","Terracotta Med","Villa Med"],["Midnight Star blue star evening","#191970","Midnight Star","Rooftop Night"],["Blush Romantic pink gold feminine","#FFC0CB","Blush Romantic","Garden"],["Dusty Sage blue sage vintage","#5B7C99","Dusty Sage","Rustic Garden"],["Chocolate Autumn brown gold cozy","#7B3F00","Chocolate Autumn","Autumn Villa"],["Olive Natural green gold outdoor","#808000","Olive Natural","Outdoor Garden"]];
  let isAdmin=false;let generatedHTMLs=[];let currentEditIndex=null;
function checkAdmin(){if(document.getElementById('adminPass').value==='sayido123'){isAdmin=true;document.getElementById('adminStatus').innerText='✅ Admin';renderResults();}else alert('salah');}
function download100Beda(){let rows=[["prompt","groom","bride","tanggal","maps","ayah_groom","ibu_groom","ayah_bride","ibu_bride","warna","lagu","tema"]];const grooms=["Kevin","Ryo","Dimas","Arif","Bima","Reza","Fajar","Galih","Hendry","Wijaya","Arya","Bagas","Cakra","Dion","Eka"];const brides=["Monica","Amanda","Putri","Sari","Dewi","Lestari","Ratna","Yuki","Maia","Nadia","Citra","Bella","Dinda","Elsa","Fani"];for(let i=0;i<100;i++){let t=THEMES_100[i%THEMES_100.length];let g=grooms[i%grooms.length]+(i>=15?i:'');let b=brides[i%brides.length]+(i>=15?i:'');rows.push([t[0]+" "+g+" "+b+" "+t[2],g,b,`2025-${String((i%12)+1).padStart(2,'0')}-${String((i%28)+1).padStart(2,'0')}`,t[3],"Bpk. Hendry","Ibu Susi","Bpk. Wijaya","Ibu Dewi",t[1],"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",t[2]]);}let ws=XLSX.utils.aoa_to_sheet(rows);let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"100_Tema");XLSX.writeFile(wb,"SAYIDO_100_FULL_MORAN.xlsx");}
let uploadedData=[];
document.getElementById('excelFile').addEventListener('change',e=>{let f=e.target.files[0];let r=new FileReader();r.onload=ev=>{let d=new Uint8Array(ev.target.result);let wb=XLSX.read(d,{type:'array'});let ws=wb.Sheets[wb.SheetNames[0]];uploadedData=XLSX.utils.sheet_to_json(ws);document.getElementById('uploadInfo').innerHTML=`✅ ${uploadedData.length} loaded`;};r.readAsArrayBuffer(f);});
function generateBulk(){if(uploadedData.length===0){alert('upload dulu');return;}generatedHTMLs=[];uploadedData.forEach((row,i)=>{setTimeout(()=>{generatedHTMLs[i]=generateFullMoran(row,i);document.getElementById('prog').style.width=((i+1)/uploadedData.length*100)+'%';document.getElementById('progText').innerText=`${i+1}/${uploadedData.length}`;if(i===uploadedData.length-1)renderResults();},i*20);});}
function generateFullMoran(row,idx){let warna=row.warna||'#D4AF37';let groom=row.groom||'Kevin';let bride=row.bride||'Monica';let tanggal=row.tanggal||'2025-12-29';let maps=row.maps||'Sheraton Surabaya';let prompt=row.prompt||'luxury';let tema=row.tema||'Moran Luxury';let ayah_groom=row.ayah_groom||'Bpk. Hendry';let ibu_groom=row.ibu_groom||'Ibu Susi';let ayah_bride=row.ayah_bride||'Bpk. Wijaya';let ibu_bride=row.ibu_bride||'Ibu Dewi';let lagu=row.lagu||'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3';let id=`${groom}-${bride}-${Date.now()+idx}`.toLowerCase().replace(/[^a-z0-9-]/g,'-');let html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>${groom} & ${bride} - ${tema}</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet"><link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Manrope',sans-serif;background:#FAF8F5;color:#1A1A1A;overflow-x:hidden}:root{--gold:${warna}} .hero{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;background:linear-gradient(180deg,#fff 0%,#F5EFE6 100%)}.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 20%,${warna}18,transparent 60%);animation:bokeh 8s infinite}@keyframes bokeh{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.08);opacity:1}}.arch-wrap{position:relative;z-index:2;width:88vw;max-width:380px}.arch{width:100%;height:580px;border:2px solid var(--gold);border-radius:200px 200px 24px 24px;position:relative;overflow:hidden;background:#fff;box-shadow:0 30px 60px rgba(0,0,0,.12)}.arch-inner{position:absolute;inset:14px;border:1px solid ${warna}33;border-radius:186px 186px 18px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 20px}.badge{background:var(--gold);color:#fff;padding:6px 14px;border-radius:20px;font-size:10px;letter-spacing:2px;text-transform:uppercase}.names{font-family:'Cormorant Garamond';font-size:42px;line-height:.9;color:var(--gold);margin:18px 0;letter-spacing:2px}.names span{display:block;font-weight:300;font-size:28px;color:#111;opacity:.4}.divider{width:60px;height:1px;background:var(--gold);margin:14px auto}.date{font-size:11px;letter-spacing:3px;text-transform:uppercase;opacity:.6}.couple{padding:80px 20px;text-align:center;max-width:600px;margin:0 auto}.couple h2{font-family:'Cormorant Garamond';font-size:28px;color:var(--gold);letter-spacing:2px}.parents{font-size:12px;opacity:.6;margin-top:6px;line-height:1.6}.venue{margin-top:60px;padding:24px;background:#fff;border:1px solid #E8E0D8;border-radius:16px}.venue h3{font-family:'Cormorant Garamond';font-size:20px;color:var(--gold)}.btn-maps{display:inline-block;margin-top:12px;padding:10px 18px;border-radius:24px;background:var(--gold);color:#fff;text-decoration:none;font-size:12px;letter-spacing:1px}.music{position:fixed;bottom:20px;right:20px;width:44px;height:44px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;box-shadow:0 4px 12px rgba(0,0,0,.2)}.countdown{display:flex;gap:12px;justify-content:center;margin-top:20px}.cd{width:64px;height:64px;border:1px solid ${warna}66;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center}.cd b{font-family:'Cormorant Garamond';font-size:22px;color:var(--gold)}.cd span{font-size:9px;letter-spacing:1px;opacity:.6}</style></head><body><div class="hero"><div class="arch-wrap" data-aos="fade-up" data-aos-duration="1200"><div class="arch"><div class="arch-inner"><span class="badge" data-aos="fade-up" data-aos-delay="100">${tema}</span><div class="names" data-aos="fade-up" data-aos-delay="300">${groom}<span>&</span>${bride}</div><div class="divider" data-aos="zoom-in" data-aos-delay="500"></div><div class="date" data-aos="fade-up" data-aos-delay="700">${tanggal} - ${maps}</div><div style="margin-top:16px;font-size:10px;opacity:.4" data-aos="fade-up" data-aos-delay="900">${prompt.slice(0,90)}</div></div></div></div></div><div class="couple"><div data-aos="fade-up"><h2>${groom} & ${bride}</h2><div class="parents">Putra dari<br><b>${ayah_groom} & ${ibu_groom}</b></div><div style="margin:24px 0" data-aos="fade-up" data-aos-delay="200"><div style="font-size:32px;color:${warna}">&</div></div><div class="parents" data-aos="fade-up" data-aos-delay="300">Putri dari<br><b>${ayah_bride} & ${ibu_bride}</b></div></div><div class="venue" data-aos="fade-up" data-aos-delay="400"><h3>Save The Date</h3><p style="font-size:12px;margin-top:8px;opacity:.7">${tanggal}</p><div class="countdown" id="cd-${id}"><div class="cd"><b id="d-${id}">00</b><span>HARI</span></div><div class="cd"><b id="h-${id}">00</b><span>JAM</span></div><div class="cd"><b id="m-${id}">00</b><span>MENIT</span></div><div class="cd"><b id="s-${id}">00</b><span>DETIK</span></div></div><div style="margin-top:20px"><h3>${maps}</h3><p style="font-size:11px;opacity:.6;margin-top:4px">The Wedding Venue</p><a class="btn-maps" href="https://maps.google.com/?q=${encodeURIComponent(maps)}" target="_blank">📍 Buka Maps</a></div></div>
<div style="margin-top:60px;padding:24px;background:${warna}0D;border-radius:16px" data-aos="fade-up"><p style="font-family:'Cormorant Garamond';font-style:italic;font-size:18px;color:${warna}">"${prompt}"</p><p style="font-size:10px;letter-spacing:2px;opacity:.5;margin-top:8px">TEMA: ${tema.toUpperCase()} - WARNA: ${warna}</p></div><p style="font-size:10px;opacity:.3;margin-top:60px;letter-spacing:3px">SAYIDO EXCLUSIVE - ${tema}</p></div><div class="music" onclick="toggleMusic()">♫</div><audio id="audio" loop><source src="${lagu}" type="audio/mpeg"></audio><script src="https://unpkg.com/aos@2.3.1/dist/aos.js"><\/script><script>AOS.init({once:true});let audio=document.getElementById('audio');let playing=false;function toggleMusic(){if(!playing){audio.play();playing=true;}else{audio.pause();playing=false;}}let target=new Date('${tanggal}').getTime();setInterval(()=>{let now=new Date().getTime();let diff=target-now;if(diff>0){document.getElementById('d-${id}').innerText=Math.floor(diff/(1000*60*60*24));document.getElementById('h-${id}').innerText=Math.floor((diff%(1000*60*60*24))/(1000*60*60));document.getElementById('m-${id}').innerText=Math.floor((diff%(1000*60*60))/(1000*60));document.getElementById('s-${id}').innerText=Math.floor((diff%(1000*60))/1000);}},1000);<\/script></body></html>`;
return {id,groom,bride,warna,tanggal,maps,prompt,tema,ayah_groom,ibu_groom,ayah_bride,ibu_bride,lagu,html,blobUrl:null};}
function renderResults(){let results=document.getElementById('results');results.innerHTML='';generatedHTMLs.forEach((item,i)=>{if(!item)return;let blob=new Blob([item.html],{type:'text/html'});let url=URL.createObjectURL(blob);item.blobUrl=url;let div=document.createElement('div');div.className='inv-card';div.innerHTML=`<div style="display:flex;justify-content:space-between"><div><h3>${item.groom} & ${item.bride}</h3><span class="badge" style="background:${item.warna};color:#fff">${item.tema}</span><span class="badge">${item.tanggal}</span><br><span style="font-size:11px;color:#888">${item.maps} - ${item.warna}</span><br><a href="${url}" target="_blank" style="font-size:11px;color:#4A90E2">/u/${item.id}.html</a></div><div style="width:40px;height:40px;border-radius:50%;background:${item.warna};border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.2)"></div></div><div class="actions"><button class="primary" onclick="previewItem(${i})">👁️ Preview FULL</button><button onclick="downloadHTML(${i})">📥 HTML</button><button onclick="openMockup(${i})">📱 Mockup</button>${isAdmin?`<button onclick="openEdit(${i})" style="background:#FFF3CD">✏️ Edit</button><button onclick="downloadVideo(${i})" style="background:#111;color:#fff">🎬 Video</button>`:''}</div>`;results.appendChild(div);});}
function previewItem(i){window.open(generatedHTMLs[i].blobUrl,'_blank');}
function downloadHTML(i){let a=document.createElement('a');a.href=generatedHTMLs[i].blobUrl;a.download=generatedHTMLs[i].id+'.html';a.click();}
function openEdit(i){currentEditIndex=i;let item=generatedHTMLs[i];document.getElementById('editForm').innerHTML=`<label>Groom</label><input id="e_groom" value="${item.groom}"><label>Bride</label><input id="e_bride" value="${item.bride}"><label>Tanggal</label><input id="e_tanggal" type="date" value="${item.tanggal}"><label>Venue</label><input id="e_maps" value="${item.maps}"><label>Warna</label><input id="e_warna" type="color" value="${item.warna}"><label>Ayah Groom</label><input id="e_ag" value="${item.ayah_groom}"><label>Ibu Groom</label><input id="e_ig" value="${item.ibu_groom}"><label>Ayah Bride</label><input id="e_ab" value="${item.ayah_bride}"><label>Ibu Bride</label><input id="e_ib" value="${item.ibu_bride}"><label>Prompt</label><textarea id="e_prompt">${item.prompt}</textarea><label>Tema</label><input id="e_tema" value="${item.tema}">`;document.getElementById('editModal').classList.add('active');}
function saveEdit(){let i=currentEditIndex;let it=generatedHTMLs[i];it.groom=document.getElementById('e_groom').value;it.bride=document.getElementById('e_bride').value;it.tanggal=document.getElementById('e_tanggal').value;it.maps=document.getElementById('e_maps').value;it.warna=document.getElementById('e_warna').value;it.ayah_groom=document.getElementById('e_ag').value;it.ibu_groom=document.getElementById('e_ig').value;it.ayah_bride=document.getElementById('e_ab').value;it.ibu_bride=document.getElementById('e_ib').value;it.prompt=document.getElementById('e_prompt').value;it.tema=document.getElementById('e_tema').value;it.html=generateFullMoran(it,i).html;let blob=new Blob([it.html],{type:'text/html'});it.blobUrl=URL.createObjectURL(blob);closeModal();renderResults();}
function closeModal(){document.getElementById('editModal').classList.remove('active');}
function openMockup(i){let item=generatedHTMLs[i];let c=document.getElementById('mockupContainer');c.innerHTML=`<div style="background:#111;padding:20px;border-radius:24px"><div style="color:#fff;font-size:12px;margin-bottom:10px">${item.tema} - ${item.groom} & ${item.bride}</div><div class="mockup-preview"><iframe src="${item.blobUrl}"></iframe></div><div style="color:#fff;font-size:11px;margin-top:10px;opacity:.6">SAYIDO - ${item.warna}</div></div>`;document.getElementById('mockupModal').classList.add('active');window._mockupIndex=i;}
function closeMockup(){document.getElementById('mockupModal').classList.remove('active');}
async function downloadMockupPNG(){let p=document.querySelector('#mockupContainer > div');let canvas=await html2canvas(p,{scale:2,useCORS:true});let a=document.createElement('a');a.download=`MOCKUP-${generatedHTMLs[window._mockupIndex].id}.png`;a.href=canvas.toDataURL('image/png');a.click();}
function downloadVideo(i){window.open(generatedHTMLs[i].blobUrl,'_blank');alert('Silakan screen-record untuk video MP4');}
</script></body></html>
